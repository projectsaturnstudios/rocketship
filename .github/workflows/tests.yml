name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies for security advisories
        run: composer audit --no-interaction

  tests:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} - ${{ matrix.loop }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]
        loop: [epoll, kqueue]
        include:
          - loop: epoll
            os: ubuntu-24.04
          - loop: kqueue
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      # The native server needs pcntl and posix in both modes; threads mode adds ext-parallel on a ZTS PHP.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, posix, sockets, pdo_sqlite${{ matrix.ts == 'zts' && ', parallel' || '' }}
          tools: composer, pie
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Install the loop extension and posi
        run: |
          sudo pie install php-io-extensions/${{ matrix.loop }}
          sudo pie install php-io-extensions/posi

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Report the native server's modes
        run: |
          php -r 'require "vendor/autoload.php"; use ProjectSaturnStudios\Rocketship\Native\WorkerMode; echo "processes: ", WorkerMode::processesAvailable() ? "yes" : "no", PHP_EOL, "threads: ", WorkerMode::threadsUnavailable() ?? "yes", PHP_EOL;'

      - name: Run Octane's tests
        run: vendor/bin/pest --ci

      - name: Run Rocketship's tests
        run: vendor/bin/pest --ci --testsuite=Rocketship
