upstream octane_field { server 127.0.0.1:8000; keepalive 64; }
upstream rocketship_field { server 127.0.0.1:8001; keepalive 64; }
server {
    listen 80;
    server_name octane.field.test;
    client_max_body_size 20m;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://octane_field;
    }
}
server {
    listen 80;
    server_name rocketship.field.test;
    client_max_body_size 20m;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://rocketship_field;
    }
}
